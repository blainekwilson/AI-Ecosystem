model_notes:
- This file defines canonical asset-participation patterns for components and flows; it does not assert that every architecture
  instantiates every binding.
- Flow bindings describe assets carried, returned, emitted, or otherwise participating in an interaction.
- Component bindings are limited to transient processing roles such as consumes and produces. Persistent custody, configuration,
  hosting, definition, registration, and governance belong in relationships-v1-frozen.yaml.
- A single flow may have multiple applicable assets because the canonical model represents reusable patterns rather than
  one concrete implementation.
- Model Input and Model Output may be bound to multiple successive inference hops intentionally; this represents propagation
  of the same logical payload across distinct architectural edges so later trust-boundary analysis can identify where
  sensitive assets cross boundaries.
binding_roles:
- name: request
  applies_to:
  - flow
  description: The asset is carried from the flow source toward the flow destination as part of the request or initiating
    message.
- name: response
  applies_to:
  - flow
  description: The asset is carried from the flow destination back toward the flow source as part of the response.
- name: exchange
  applies_to:
  - flow
  description: The asset may move in either direction or be updated through a genuinely bidirectional or mixed interaction
    where request/response direction cannot be represented accurately. Use request or response whenever the specific
    asset's direction is known.
- name: emitted
  applies_to:
  - flow
  description: The asset is emitted or published by the flow source as the primary record or artifact of a notification/write
    interaction.
- name: consumes
  applies_to:
  - component
  description: The component transiently reads, interprets, or processes the asset as part of its function.
- name: produces
  applies_to:
  - component
  description: The component creates or assembles the asset as part of its function.

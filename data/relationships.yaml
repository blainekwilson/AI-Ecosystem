model_notes:
- This file defines valid canonical non-flow architectural relationship patterns, not mandatory universal relationships.
- A specific architecture instantiates only the subset of relationships that applies to that system.
- Runtime interactions belong in flows.yaml; transient asset participation in interactions belongs in the future
  asset-binding model.
relationship_types:
- name: defined_by
  inverse: defines
  description: The source component's identity, capabilities, or logical behavior are materially described by the
    destination asset.
- name: configured_by
  inverse: configures
  description: The source component's standing behavior or operating parameters are influenced by the destination
    configuration asset. Dynamically assembled runtime content belongs in asset bindings rather than this relationship.
- name: instantiated_from
  inverse: instantiates
  description: The source runtime component is created, loaded, or realized from the destination artifact.
- name: hosted_on
  inverse: hosts
  description: The source runtime component executes or is served on the destination platform or runtime environment.
- name: stored_in
  inverse: stores
  description: The source asset is persistently or durably held, retained, indexed, or kept in the custody of the
    destination component. Use registered_in when the destination catalogs or versions the asset without implying
    custody of its raw content.
- name: managed_by
  inverse: manages
  description: The source asset or component is subject to administrative, governance, lifecycle, or decision authority
    exercised by the destination component. This does not by itself imply storage, registration, or runtime interaction.
- name: exposed_by
  inverse: exposes
  description: The source capability component is advertised or made available through the destination integration
    component without implying that an invocation is currently occurring. This relationship is protocol-neutral.
- name: registered_in
  inverse: registers
  description: The source asset is cataloged, versioned, inventoried, or tracked by the destination component without
    necessarily implying that the destination holds the asset's raw content.
